services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: pepe
      POSTGRES_PASSWORD: pepe_local
      POSTGRES_DB: pepe
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs
      SQS_ENDPOINT_STRATEGY: path
    ports:
      - "127.0.0.1:4566:4566"

volumes:
  postgres_data:
